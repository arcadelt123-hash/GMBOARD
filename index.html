<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GM 세션 보드</title>
<style>
:root{
  --bg:#e9dfc8; --grid:#d8caa8; --ink:#2d2410; --muted:#7a6a48; --bar:#5b3f22; --barink:#f6ecd6;
  --card:#fbf4e2; --line:#c9b98f; --accent:#b8481f; --ok:#2f7d4f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
button,select,input,textarea{font:inherit;color:inherit}
#teambar{position:fixed;left:0;right:0;top:0;height:32px;background:#2e1f0e;color:var(--barink);display:flex;align-items:center;gap:4px;padding:0 10px;z-index:51;overflow-x:auto;white-space:nowrap}
.team{padding:3px 12px;border-radius:8px;cursor:pointer;flex:none;background:#fff1}.team.on{background:#e8b04a;color:#3a2610;font-weight:800}
#teambar .tb{min-height:24px;padding:1px 9px}
#top{position:fixed;left:0;right:0;top:32px;height:46px;background:var(--bar);color:var(--barink);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:50;box-shadow:0 2px 8px #0004;overflow-x:auto;white-space:nowrap}
#top .sep{width:1px;height:22px;background:#fff3;margin:0 4px;flex:none}
.tb{background:#fff1;border:1px solid #fff3;color:var(--barink);border-radius:8px;padding:4px 10px;cursor:pointer;flex:none;min-height:30px}
.tb:hover{background:#fff3}.tb.on{background:#e8b04a;color:#3a2610;border-color:#e8b04a}
#tabs{display:flex;gap:4px;flex:none}
.tab{padding:4px 10px;border-radius:8px 8px 0 0;background:#0003;cursor:pointer;flex:none}
.tab.on{background:var(--bg);color:var(--ink);font-weight:700}
#zoomv{min-width:46px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
#sel{position:fixed;left:50%;transform:translateX(-50%);top:86px;z-index:49;background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:none;gap:6px;align-items:center;box-shadow:0 4px 14px #0003;max-width:96vw;overflow-x:auto;white-space:nowrap}
#sel.show{display:flex}
#sel .sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0004;cursor:pointer;flex:none}
#sel button,#sel select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;min-height:28px;flex:none}
#sel .del{color:#fff;background:#c0392b;border-color:#c0392b}
#vp{position:fixed;left:0;right:0;top:78px;bottom:0;overflow:hidden;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:28px 28px}
#vp.pan{cursor:grabbing}#vp.link{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lines path{fill:none;stroke:#7a5a30;stroke-width:3;pointer-events:stroke;cursor:pointer;opacity:.75}
#lines path.sel{stroke:var(--accent);stroke-width:5;opacity:1}
.bx{position:absolute;background:var(--card);border:2px solid var(--c,#c9b98f);border-radius:12px;box-shadow:0 3px 10px #0003;display:flex;flex-direction:column;overflow:hidden;min-width:140px;min-height:60px}
.bx.sel{outline:3px solid var(--accent);outline-offset:2px}
.bx.dim{opacity:.18}.bx.hit{outline:4px solid #e8b04a;outline-offset:3px}
.bx .hd{display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--c,#c9b98f);cursor:move;flex:none}
.bx .hd input{flex:1;min-width:0;background:transparent;border:0;font-weight:800;font-size:calc(var(--fs,15px) + 1px);padding:2px 4px;outline:none;color:#2d2410}
.bx .hd input:focus{background:#fff8}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#fff9;border:1px solid #0003;cursor:pointer;flex:none;color:#2d2410}
.chip.st1{background:#ffe9a8}.chip.st2{background:#b9e3c6}
.fold{cursor:pointer;flex:none;opacity:.7;background:none;border:0;padding:0 4px;font-size:14px}
.bx textarea{flex:1;min-height:0;width:100%;border:0;resize:none;background:transparent;padding:8px 10px;outline:none;font-size:var(--fs,15px);line-height:1.55;color:var(--ink);-webkit-user-select:text;user-select:text}
.bx .rs{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 52%,#7a5a30aa 52%,#7a5a30aa 60%,transparent 60%,transparent 72%,#7a5a30aa 72%,#7a5a30aa 80%,transparent 80%)}
.bx.fold1{height:auto!important;min-height:0}.bx.fold1 textarea,.bx.fold1 .rs{display:none}
.bx.t-memo{background:#fff6b8;border-radius:6px;box-shadow:2px 5px 12px #0004}
.bx.t-memo .hd{background:var(--c,#f1d34e)}
.bx.t-frame{background:transparent;border:3px dashed var(--c,#9b8452);box-shadow:none;z-index:0}
.bx.t-frame .hd{background:transparent}
.bx.t-frame textarea{display:none}
.bx.t-frame .hd input{font-size:calc(var(--fs,15px) * 1.5)}
/* 한눈에 보기: 멀리서 보면 제목만 크게 */
#world.lod .bx textarea{visibility:hidden}
#world.lod .bx .hd{flex:1;align-items:flex-start;padding:10px}
#world.lod .bx .hd input{font-size:calc(var(--fs,15px) * var(--lodk,2.4));white-space:normal;pointer-events:none}
#world.lod .bx .rs,#world.lod .bx .fold{display:none}
#world.lod .bx.t-frame .hd input{font-size:calc(var(--fs,15px) * var(--lodk,2.4) * 1.3)}
#mini{position:fixed;right:10px;bottom:10px;width:180px;height:120px;background:#fffaf0cc;border:1px solid var(--line);border-radius:10px;z-index:40;overflow:hidden}
#mini canvas{width:100%;height:100%;display:block}
#help{position:fixed;left:10px;bottom:10px;z-index:40;font-size:12px;color:var(--muted);background:#fffaf0cc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:min(560px,60vw)}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:10px;padding:8px 14px;z-index:99;display:none}
#marq{position:absolute;border:2px dashed var(--accent);background:#b8481f18;display:none;z-index:5}
#srch{display:none;width:150px;padding:4px 8px;border-radius:8px;border:0;flex:none}
@media (max-width:720px){#help{display:none}#mini{width:120px;height:80px}}

#docv{position:fixed;left:0;right:0;top:78px;bottom:0;background:#d8cfb8;z-index:45;display:none;-webkit-user-select:text;user-select:text;touch-action:auto}
#docv.show{display:flex}
#dlist{width:210px;flex:none;background:#efe6cf;border-right:1px solid var(--line);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#dlist .di{padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dlist .di.on{background:#fffaf0;border-color:var(--line);font-weight:700}
#dmain{flex:1;min-width:0;display:flex;flex-direction:column}
#dbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:#fffaf0;border-bottom:1px solid var(--line);padding:6px 10px}
#dbar button,#dbar select,#dbar input[type=color]{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;min-height:28px}
#dbar input[type=color]{padding:0;width:32px}
#dscroll{flex:1;overflow:auto;padding:22px 12px}
#dpage{background:#fff;max-width:820px;min-height:100%;margin:0 auto;padding:44px 56px;box-shadow:0 2px 12px #0003;border-radius:4px}
#dtitle{width:100%;border:0;outline:none;font-size:28px;font-weight:800;margin-bottom:14px;background:transparent;color:var(--ink)}
#dbody{outline:none;min-height:60vh;font-size:16px;line-height:1.8;color:#222;white-space:pre-wrap;word-break:break-word}
#dbody h2{font-size:22px;margin:18px 0 6px}#dbody h3{font-size:18px;margin:14px 0 4px}#dbody hr{border:0;border-top:1px solid #ccc;margin:14px 0}
#dbody ul,#dbody ol{margin:4px 0;padding-left:26px}
@media (max-width:720px){#dlist{width:96px;font-size:12px}#dpage{padding:22px 16px}}

.who{display:flex;flex-wrap:wrap;gap:3px;padding:3px 6px 0;flex:none}
.wc{font-size:11px;padding:0 7px;border-radius:99px;background:var(--wc,#ddd);border:1px solid #0003;color:#2d2410}
.bx.hasbd{border:var(--bdw,2px) var(--bds,solid) var(--bdc,#c9b98f)!important;border-radius:var(--bdr,12px)!important}
.bx.t-img{background:var(--c,#fffdf6);border-radius:6px;padding:8px 8px 0;border:1px solid #0003;box-shadow:2px 6px 14px #0005}
.bx.t-img .im{flex:1;min-height:0;position:relative}
.bx.t-img .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;border-radius:3px;-webkit-user-drag:none}
.bx.t-img .hd{background:transparent;padding:4px 2px}
.bx.t-img .hd input{text-align:center;font-weight:600}
.bx.t-img .rs{right:2px;bottom:2px}
.bx.snd::after{content:'저널로';position:absolute;left:6px;bottom:3px;background:#3b6fa8;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;pointer-events:none;z-index:5}
.bx.t-img.card{padding:8px 6px 6px;border-radius:12px;border:1.5px dashed #b9a67a;background:var(--c,#fffdf6);box-shadow:0 2px 6px #0003}
.bx.t-img.card.pc{border:1.5px solid #b8893a;background:#efe0b8}
.bx.t-img.card .im img{border-radius:10px;background:#eadfc3}
.bx.t-img.card .hd{padding:4px 0 0}
.bx.t-img.card .hd textarea{width:100%;box-sizing:border-box;border:0;background:transparent;text-align:center;font-weight:700;font-size:.82rem;line-height:1.2;font-family:inherit;color:inherit;resize:none;overflow:hidden;height:2.6em;padding:0;outline:none}
.bx.t-img.card .who{display:none}
#world.lod .bx .who{display:none}
#dlg{position:fixed;inset:0;background:#0006;z-index:90;display:none;align-items:center;justify-content:center;-webkit-user-select:text;user-select:text}
#dlg.show{display:flex}
#dlgbox{background:#fffaf0;border-radius:14px;padding:16px;width:min(440px,94vw);max-height:84vh;overflow:auto;box-shadow:0 10px 40px #0007}
#dlgbox h3{margin:0 0 10px;font-size:16px}
#dlgbox .row{display:flex;gap:6px;align-items:center;margin:5px 0}
#dlgbox input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
#dlgbox input[type=color]{width:34px;height:30px;border:0;padding:0;background:none}
#dlgbox button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
#dlgbox .ok{background:#5b3f22;color:#fff;border-color:#5b3f22}
#dwrap{flex:1;min-height:0;display:flex}
#dmemos{width:260px;flex:none;border-left:1px solid var(--line);background:#efe6cf;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.dmc{background:#fff6b8;border-radius:8px;padding:6px;border:2px solid var(--c,#f1d34e);box-shadow:0 2px 6px #0003}
.dmc.fl{outline:3px solid var(--accent)}
.dmc .q{font-size:11px;color:#7a6a48;border-left:3px solid var(--c,#f1d34e);padding-left:6px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmc textarea{width:100%;min-height:64px;border:1px solid #0002;border-radius:6px;background:#fffdee;padding:5px;resize:vertical;font-size:13px;-webkit-user-select:text;user-select:text}
.dmc .r{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.dmc button,.dmc select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:1px 7px;font-size:12px;cursor:pointer}
#dbody .dm{background:#fff17688;border-bottom:2px solid #e0a020;cursor:pointer;border-radius:2px}
@media (max-width:720px){#dmemos{width:150px}}

.bx.t-map{background:var(--c,#fffdf6);border-radius:8px;padding:8px 8px 0;border:2px solid #6a4a22;box-shadow:2px 6px 14px #0005}
.bx.t-map .im{flex:1;min-height:0;position:relative;background:#0002;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bx.t-map .im img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.bx.t-map .hd{background:transparent;padding:4px 2px}.bx.t-map .hd input{font-weight:700}
.bx.t-map .rs{right:2px;bottom:2px}
.pin{position:absolute;width:18px;height:18px;margin:-18px 0 0 -9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc,#c0392b);border:2px solid #fff;box-shadow:0 1px 4px #0006;pointer-events:none}
.pin::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#fff}
.mapbtn{flex:none;border:1px solid #0003;background:#fff;border-radius:7px;font-size:12px;padding:0 8px;cursor:pointer;white-space:nowrap}
#mapv{position:fixed;inset:0;background:#1a1209;z-index:80;display:none;flex-direction:column;-webkit-user-select:text;user-select:text;touch-action:auto}
#mapv.show{display:flex}
#mvbar{display:flex;gap:8px;align-items:center;background:#2e1f0e;color:#f6ecd6;padding:6px 12px}
#mvbar button{border:1px solid #fff4;background:#fff2;color:#f6ecd6;border-radius:8px;padding:3px 12px;cursor:pointer}
#mvbar button.on{background:#e8b04a;color:#3a2610}
#mvmain{flex:1;min-height:0;display:flex}
#mvstage{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#mvwrap{position:relative;line-height:0}
#mvimg{max-width:calc(100vw - 330px);max-height:calc(100vh - 80px);display:block;-webkit-user-drag:none}
@media (max-width:720px){#mvimg{max-width:96vw;max-height:46vh}}
.mpin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc,#c0392b);border:3px solid #fff;box-shadow:0 2px 6px #0008;cursor:pointer;color:#fff;font:700 12px/20px sans-serif;text-align:center}
.mpin span{display:block;transform:rotate(45deg)}
.mpin.on{outline:3px solid #e8b04a}
#mvside{width:300px;flex:none;background:#fffaf0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#mvside input[type=text],#mvside textarea,#mvside select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;width:100%}
#mvside textarea{min-height:110px;resize:vertical}
.mpl{padding:5px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff}.mpl.on{background:#ffe9a8}
@media (max-width:720px){#mvmain{flex-direction:column}#mvside{width:auto;max-height:46vh}}

#more{position:fixed;top:82px;right:10px;z-index:60;background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px #0005;display:none;flex-direction:column;gap:4px;min-width:200px;max-height:calc(100vh - 100px);overflow-y:auto}
#more.show{display:flex}
#more .tb{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}
#more .tb:hover{background:#ffe9a8}
#more .mg{font-size:11px;color:var(--muted);margin:6px 2px 0;font-weight:700}
#more select.tb{padding:3px 6px}
#morebtn.dot::after{content:"●";color:#e8b04a;margin-left:4px;font-size:10px}
#srch{width:170px}
#srr{position:fixed;top:82px;left:50%;transform:translateX(-50%);width:min(560px,94vw);max-height:60vh;overflow-y:auto;background:#fffaf0;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0005;z-index:61;display:none;padding:6px;-webkit-user-select:text;user-select:text}
#srr.show{display:block}
#srr .sr{padding:6px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid #0001}
#srr .sr:hover{background:#ffe9a8}#srr .sr small{color:var(--muted)}
#srr mark{background:#ffe066;padding:0 1px}
#playbar{position:fixed;left:10px;top:10px;z-index:62;display:none;gap:6px;background:#2e1f0ecc;padding:6px 8px;border-radius:12px}
body.play #playbar{display:flex}
body.play #teambar,body.play #top,body.play #help,body.play #mini,body.play #sel,body.play #more{display:none!important}
body.play #vp{top:0}
body.play .bx .rs{display:none}
body.play .bx .hd{cursor:default}
.star{flex:none;color:#e8a000;font-size:14px;padding:0 2px}
#clv{position:fixed;inset:0;background:#0007;z-index:85;display:none;align-items:center;justify-content:center;-webkit-user-select:text;user-select:text;touch-action:auto}
#clv.show{display:flex}
#clvbox{background:#fffaf0;border-radius:14px;width:min(1100px,96vw);height:min(86vh,800px);display:flex;flex-direction:column;box-shadow:0 10px 40px #0007}
#clvbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#clvbar select,#clvbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;min-height:28px;color:var(--ink)}
#clvcols{flex:1;min-height:0;display:flex;gap:10px;padding:10px;overflow:auto}
.clc{flex:1 1 0;min-width:240px;background:#efe6cf;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.clc h4{margin:2px 4px;font-size:14px}
.clcard{background:#fff;border-radius:8px;border-left:6px solid var(--c,#f1d34e);padding:6px 8px;box-shadow:0 1px 4px #0002}
.clcard .t{font-weight:700;cursor:pointer}.clcard .t:hover{text-decoration:underline}
.clcard .s{font-size:12px;color:var(--muted)}
.clcard button{border:1px solid var(--line);background:#fffaf0;border-radius:7px;padding:0 8px;font-size:12px;cursor:pointer;color:var(--ink)}

body.dark{--bg:#1c1812;--grid:#2c261b;--ink:#efe6d2;--muted:#b4a582;--card:#2b241a;--line:#5c4b30}
body.dark #more,body.dark #sel,body.dark #srr,body.dark #dlgbox,body.dark #clvbox,body.dark #mvside,body.dark #dlist,body.dark #dbar{background:#2a2218;color:var(--ink)}
body.dark #dmemos,body.dark .clc{background:#221b12}
body.dark #more .tb,body.dark #sel button,body.dark #sel select,body.dark #dbar button,body.dark #dbar select,body.dark #dlgbox button,body.dark #dlgbox input[type=text],body.dark #mvside input[type=text],body.dark #mvside textarea,body.dark #mvside select,body.dark .clcard,body.dark .clcard button{background:#3a3023;color:var(--ink);border-color:#5c4b30}
body.dark #more .tb:hover{background:#4a3c2a}
body.dark #dlist .di.on{background:#3a3023}
body.dark #dscroll{background:#14110c}
body.dark .bx.t-text{border-color:var(--c)}
body.dark .bx textarea,body.dark #dlgbox,body.dark #mvside{color:var(--ink)}
body.dark .bx.t-img .hd input,body.dark .bx.t-map .hd input{color:#2d2410}
@media (pointer:coarse){.bx .rs{width:34px!important;height:34px!important}#top button,#playbar .tb,#sel button{min-height:36px}.bx .hd{min-height:34px}}
body.play .bx.sel{outline:3px solid #e8a000}
#morebtn{position:sticky;right:0;margin-left:auto;background:var(--bar)}
@media (max-width:760px){#top .sep,#zoomv,#top button[onclick^="zoomBy"],#top button[onclick="redo()"]{display:none}#syncbtn{max-width:84px;overflow:hidden;text-overflow:ellipsis}#srch{width:110px}}
</style>
</head>
<body>
<div id="teambar"><div id="teams" style="display:flex;gap:4px"></div><button class="tb" onclick="addTeam()" title="새 팀(TRPG 캠페인)">＋ 팀</button><span style="flex:1"></span><button class="tb" onclick="charsEdit()" title="이 팀의 등장인물(PC·NPC) 목록">인물</button><button class="tb" onclick="kindsEdit()" title="메모 종류 편집">메모 종류</button></div>
<div id="top">
  <div id="tabs"></div>
  <button class="tb" onclick="addBoard()" title="새 보드(회차)">＋</button>
  <span class="sep"></span>
  <button class="tb" id="docbtn" onclick="toggleDoc()" title="큰 글쓰기 페이지 (구글 문서처럼)">문서</button>
  <button class="tb" onclick="addBox('text')" title="텍스트 박스 (N)">＋ 텍스트</button>
  <button class="tb" onclick="addBox('memo')" title="단서 · 떡밥 메모 (M)">＋ 메모</button>
  <button class="tb" id="linkbtn" onclick="toggleLink()" title="두 박스를 선으로 잇기 (L)">연결</button>
  <span class="sep"></span>
  <button class="tb" onclick="zoomBy(1/1.25)">－</button>
  <span id="zoomv">100%</span>
  <button class="tb" onclick="zoomBy(1.25)">＋</button>

</div></div>

<script>
'use strict';
const KEY='gm_board_v1';
const COLORS=['#d9c18a','#e6a58f','#9fc7a0','#9bb8d9','#c7a6d9','#f1d34e','#cfcfcf','#e8845a'];
const DEFK=[{n:'단서',c:'#f1d34e'},{n:'떡밥',c:'#e6a58f'},{n:'복선',c:'#c7a6d9'},{n:'NPC',c:'#9bb8d9'},{n:'장소',c:'#9fc7a0'},{n:'할 일',c:'#cfcfcf'}];
const KS=()=>(S&&S.kinds&&S.kinds.length)?S.kinds:DEFK, KN=()=>KS().map(k=>k.n), kcol=n=>(KS().find(k=>k.n===n)||{c:'#f1d34e'}).c;
const CH=()=>(T&&T.chars)||[], chName=id=>(CH().find(c=>c.id===id)||{}).name||'?', chCol=id=>(CH().find(c=>c.id===id)||{}).c||'#ddd';
let T=null;
const ST=['미공개','공개함','회수'];
let S=null;            // {teams:[{id,name,boards,cur,docs,chars}],team,kinds, + 현재 팀 별칭 boards/cur/docs}
let B=null;            // current board
let sel=new Set(), selLine=null, linkMode=false, linkFrom=null, filter='', filterC='', hits=new Set();
const $=id=>document.getElementById(id);
const vp=$('vp'), world=$('world'), lines=$('lines');
const uid=()=>'b'+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}

/* ---------- 저장 ---------- */
function newBoard(name){return{id:uid(),name:name||'새 보드',boxes:[],links:[],view:{x:60,y:60,z:1}}}
function newTeam(name){const b=newBoard('세션 1');return{id:uid(),name:name||'새 팀',boards:[b],cur:b.id,docs:[],chars:[]}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)}}catch(e){}
  adopt(S);
}
function adopt(d){ // 옛 형식(boards만 있는 것)도 팀 하나로 감싸서 받아요
  if(d&&d.boards&&!d.teams){const b=d.boards;d={teams:[{id:uid(),name:'팀 1',boards:b,cur:d.cur||(b[0]&&b[0].id),docs:d.docs||[],chars:[]}],kinds:d.kinds}}
  if(!d||!d.teams||!d.teams.length)d={teams:[newTeam('팀 1')]};
  d.teams.forEach(t=>{if(!t.boards||!t.boards.length){const b=newBoard('세션 1');t.boards=[b];t.cur=b.id}t.docs=t.docs||[];t.chars=t.chars||[];t.boards.forEach(b=>{b.view=b.view||viewsGet()[b.id]||{x:60,y:60,z:1};b.boxes=b.boxes||[];b.links=b.links||[]})});
  S=d;S.kinds=S.kinds&&S.kinds.length?S.kinds:null;
  T=S.teams.find(t=>t.id===S.team)||S.teams[0];S.team=T.id;
  S.boards=T.boards;S.cur=T.cur;S.docs=T.docs;
  B=S.boards.find(b=>b.id===S.cur)||S.boards[0];S.cur=B.id;
}
function commit(){if(!T)return;T.boards=S.boards;T.cur=S.cur;T.docs=S.docs}
function ser(){commit();return JSON.stringify({teams:S.teams,team:S.team,kinds:S.kinds,sites:S.sites||null,tpls:S.tpls||[]})}
function useTeam(id){
  commit();T=S.teams.find(t=>t.id===id);S.team=id;S.boards=T.boards;S.cur=T.cur;S.docs=T.docs;
  B=S.boards.find(b=>b.id===S.cur)||S.boards[0];S.cur=B.id;sel.clear();selLine=null;hist=[];fut=[];hits.clear();filter='';filterC='';$('flt').value='';
  docCur=null;if(docOpen)docRender();drawTeams();drawTabs();render();save();
}
function drawTeams(){$('teams').innerHTML=S.teams.map(t=>`<div class="team${t.id===T.id?' on':''}" data-id="${t.id}">${esc(t.name)}</div>`).join('')}
$('teams').addEventListener('click',e=>{const t=e.target.closest('.team');if(t&&t.dataset.id!==T.id)useTeam(t.dataset.id)});
$('teams').addEventListener('dblclick',e=>{
  const t=e.target.closest('.team');if(!t)return;const x=S.teams.find(a=>a.id===t.dataset.id);
  const n=prompt('팀 이름 (비우면 삭제를 물어봐요)',x.name);if(n===null)return;
  if(n.trim()===''){if(S.teams.length>1&&confirm('"'+x.name+'" 팀과 그 안의 보드·문서를 모두 삭제할까요? 되돌릴 수 없어요.')){S.teams=S.teams.filter(a=>a!==x);useTeam(S.teams[0].id)}return}
  x.name=n.trim();drawTeams();save();
});
function addTeam(){const n=prompt('새 팀(캠페인) 이름','팀 '+(S.teams.length+1));if(n===null)return;const t=newTeam(n||'새 팀');S.teams.push(t);useTeam(t.id)}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,ser())}catch(e){toast('저장 공간이 가득 찼어요. [저장(JSON)]으로 파일을 받아 두세요')}},350);syncDirty()}
/* 되돌리기 */
let hist=[],fut=[];
function snap(){hist.push(JSON.stringify({boxes:B.boxes,links:B.links}));if(hist.length>80)hist.shift();fut=[];save()}
function restore(j){const d=JSON.parse(j);B.boxes=d.boxes;B.links=d.links;sel.clear();selLine=null;render()}
function undo(){if(!hist.length)return;fut.push(JSON.stringify({boxes:B.boxes,links:B.links}));restore(hist.pop());save()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify({boxes:B.boxes,links:B.links}));restore(fut.pop());save()}

/* ---------- 보기(이동·확대) ---------- */
function applyView(){
  const v=B.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;
  $('zoomv').textContent=Math.round(v.z*100)+'%';
  const lod=v.z<0.55;world.classList.toggle('lod',lod);
  world.style.setProperty('--lodk',String(clamp(0.9/v.z,1.2,14)));
  drawMini();
}
function zoomAt(cx,cy,k){const v=B.view,nz=clamp(v.z*k,0.08,3);k=nz/v.z;v.x=cx-(cx-v.x)*k;v.y=cy-(cy-v.y)*k;v.z=nz;applyView();save()}
function zoomBy(k){const r=vp.getBoundingClientRect();zoomAt(r.width/2,r.height/2,k)}
function bounds(list){
  if(!list.length)return null;let a=1e9,b=1e9,c=-1e9,d=-1e9;
  list.forEach(o=>{a=Math.min(a,o.x);b=Math.min(b,o.y);c=Math.max(c,o.x+o.w);d=Math.max(d,o.y+(o.fold?40:o.h))});
  return{x:a,y:b,w:c-a,h:d-b};
}
function fitAll(list){
  list=list&&list.length?list:B.boxes;const bb=bounds(list);if(!bb)return;
  const r=vp.getBoundingClientRect(),m=50,z=clamp(Math.min((r.width-m*2)/bb.w,(r.height-m*2)/bb.h),0.08,1.2);
  B.view.z=z;B.view.x=(r.width-bb.w*z)/2-bb.x*z;B.view.y=(r.height-bb.h*z)/2-bb.y*z;applyView();save();
}
const toWorld=(sx,sy)=>{const r=vp.getBoundingClientRect(),v=B.view;return{x:(sx-r.left-v.x)/v.z,y:(sy-r.top-v.y)/v.z}};

/* ---------- 렌더 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function whoHtml(b){return b.who&&b.who.length?'<div class="who">'+b.who.map(i=>`<span class="wc" data-w="${i}" style="--wc:${chCol(i)}">${esc(chName(i))}</span>`).join('')+'</div>':''}
function boxEl(b){
  const d=document.createElement('div');d.dataset.id=b.id;
  d.className='bx t-'+b.t+(b.fold?' fold1':'')+(b.bd?' hasbd':'')+(b.snd?' snd':'');
  d.style.cssText=`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--c:${b.c};--fs:${b.fs||15}px;${b.bd?`--bds:${b.bd.s||'solid'};--bdc:${b.bd.c||'#c9b98f'};--bdw:${b.bd.w==null?2:b.bd.w}px;--bdr:${b.bd.r==null?12:b.bd.r}px;`:''}z-index:${b.t==='frame'?0:(b.z||1)}`;
  if(b.t==='img'&&b.card){d.className+=' card'+(b.r20&&b.r20.pc?' pc':'');d.innerHTML=`<div class="im"><img src="${esc(b.src)}" alt="" draggable="false"></div><div class="hd"><textarea data-a="title" rows="2" placeholder="이름">${esc(b.title)}</textarea></div><div class="rs" data-a="rs"></div>`;return d}
  if(b.t==='img'){d.innerHTML=`<div class="im"><img src="${esc(b.src)}" alt="" draggable="false"></div><div class="hd"><input data-a="title" value="${esc(b.title)}" placeholder="설명"></div>${whoHtml(b)}<div class="rs" data-a="rs"></div>`;return d}
  if(b.t==='map'){const n=(b.pins||[]).length;d.innerHTML=`<div class="im"><div class="mi" style="position:relative"><img src="${esc(b.src)}" alt="" draggable="false">${(b.pins||[]).map((p,i)=>`<i class="pin" style="left:${p.x*100}%;top:${p.y*100}%;--pc:${esc(p.c||'#c0392b')}"></i>`).join('')}</div></div><div class="hd"><input data-a="title" value="${esc(b.title)}" placeholder="지도 이름"><button class="mapbtn" data-a="open">핀 ${n}</button></div>${whoHtml(b)}<div class="rs" data-a="rs"></div>`;return d}
  let h='<div class="hd">';
  if(b.t==='memo')h+=`<span class="chip" style="background:${esc(kcol(b.kind))}" data-a="kind">${esc(b.kind||'단서')}</span><span class="chip st${b.st||0}" data-a="st">${ST[b.st||0]}</span>`;
  if(b.star)h+='<span class="star">오늘</span>';
  h+=`<input data-a="title" value="${esc(b.title)}" placeholder="${b.t==='frame'?'묶음 이름':'제목'}">`;
  if(b.t!=='frame')h+=`<button class="fold" data-a="fold" title="접기/펼치기">${b.fold?'▸':'▾'}</button>`;
  h+='</div>'+whoHtml(b);
  if(b.t!=='frame')h+=`<textarea data-a="body" placeholder="내용을 적어요">${esc(b.body)}</textarea><div class="rs" data-a="rs"></div>`;
  else h+='<div class="rs" data-a="rs"></div>';
  d.innerHTML=h;return d;
}
function render(){
  world.querySelectorAll('.bx').forEach(e=>e.remove());
  B.boxes.slice().sort((a,b)=>(a.t==='frame'?0:1)-(b.t==='frame'?0:1)).forEach(b=>world.appendChild(boxEl(b)));
  decorate();mapFitAll();drawLines();updFilterOpts();updFilterC();applyView();selBar();
}
function decorate(){
  world.querySelectorAll('.bx').forEach(e=>{
    const b=bx(e.dataset.id);if(!b)return;
    e.classList.toggle('sel',sel.has(b.id));
    e.classList.toggle('hit',hits.has(b.id));
    const dim=(filter&&!(filter==='__text'?b.t==='text':(b.t==='memo'&&b.kind===filter)))||(filterC&&!(b.who||[]).includes(filterC));
    e.classList.toggle('dim',!!dim||(playMode&&starOnly&&!b.star));
  });
}
const bx=id=>B.boxes.find(b=>b.id===id);
function side(b,to){ // 박스 가장자리 위의 연결점
  const hh=b.fold?36:b.h,cx=b.x+b.w/2,cy=b.y+hh/2,dx=to.x-cx,dy=to.y-cy;
  const k=Math.min(Math.abs(dx)>0?(b.w/2)/Math.abs(dx):1e9,Math.abs(dy)>0?(hh/2)/Math.abs(dy):1e9);
  return{x:cx+dx*k,y:cy+dy*k};
}
function drawLines(){
  let h='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5a30" stroke="none"/></marker></defs>';
  B.links.forEach((l,i)=>{
    const a=bx(l.a),b=bx(l.b);if(!a||!b)return;
    const ca={x:a.x+a.w/2,y:a.y+(a.fold?18:a.h/2)},cb={x:b.x+b.w/2,y:b.y+(b.fold?18:b.h/2)};
    const p=side(a,cb),q=side(b,ca),mx=(p.x+q.x)/2;
    h+=`<path data-i="${i}" class="${selLine===i?'sel':''}" marker-end="url(#ar)" d="M${p.x} ${p.y} C${mx} ${p.y},${mx} ${q.y},${q.x} ${q.y}"/>`;
  });
  B.boxes.filter(m=>m.t==='map').forEach(m=>(m.pins||[]).forEach(p=>{const t=p.link&&bx(p.link);if(!t)return;
    const ca={x:m.x+m.w/2,y:m.y+m.h/2},cb={x:t.x+t.w/2,y:t.y+(t.fold?18:t.h/2)},a=side(m,cb),q=side(t,ca);
    h+=`<path d="M${a.x} ${a.y} L${q.x} ${q.y}" style="stroke:${esc(p.c||'#c0392b')};stroke-dasharray:10 7;stroke-width:3;pointer-events:none"/>`}));
  lines.innerHTML=h;
}
function drawMini(){
  const c=$('mc'),r=c.getBoundingClientRect();if(!r.width)return;c.width=r.width*2;c.height=r.height*2;
  const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  const bb=bounds(B.boxes);if(!bb)return;
  const vr=vp.getBoundingClientRect(),v=B.view,vw={x:-v.x/v.z,y:-v.y/v.z,w:vr.width/v.z,h:vr.height/v.z};
  const ax=Math.min(bb.x,vw.x),ay=Math.min(bb.y,vw.y),bx2=Math.max(bb.x+bb.w,vw.x+vw.w),by2=Math.max(bb.y+bb.h,vw.y+vw.h);
  const k=Math.min(c.width/(bx2-ax),c.height/(by2-ay))*0.92,ox=(c.width-(bx2-ax)*k)/2-ax*k,oy=(c.height-(by2-ay)*k)/2-ay*k;
  drawMini.m={k,ox,oy};

function splitChapters(txt){
  const out=[];let cur=null;
  txt.replace(/\r/g,'').split('\n').forEach(ln=>{
    const m=ln.match(/^(#{1,3})\s+(.*)$/);
    const t=m?m[2].replace(/\*\*/g,'').trim():'';
    if(m&&(m[1].length===2||/^(제\s*)?\d+\s*장/.test(t))&&t){cur={title:t.length>26?t.slice(0,26)+'…':t,text:ln+'\n'};out.push(cur);return}
    if(!cur){if(!ln.trim())return;cur={title:'앞부분',text:''};out.push(cur)}
    cur.text+=ln+'\n';
  });
  return out.filter(p=>p.text.replace(/\s/g,'').length>0);
}
function importText(txt,name){
  // 큰 제목(#, ##, ###)마다 "틀"을 만들고, 그 아래 작은 제목(####)과 본문을 박스로 담아요
  const bd=newBoard(name),clean=s=>s.replace(/^#+\s*/,'').replace(/\*\*/g,'').trim();
  const groups=[];let g=null,sec=null;
  const newG=t=>{g={title:t,secs:[]};groups.push(g);sec=null};
  txt.replace(/\r/g,'').split('\n').forEach(ln=>{
    const m=ln.match(/^(#{1,6})\s+(.*)$/);
    if(m){const lv=m[1].length,t=clean(ln);
      if(lv<=3){newG(t);sec={title:t,body:[]};g.secs.push(sec);return}
      if(!g)newG(name);sec={title:t,body:[]};g.secs.push(sec);return}
    if(/^\s*$/.test(ln)&&(!sec||!sec.body.length))return;
    if(!g)newG(name);if(!sec){sec={title:g.title,body:[]};g.secs.push(sec)}
    sec.body.push(ln.replace(/^\s*-----+\s*$/,'').replace(/^\s*[*-]\s+/,'• ').replace(/\\?\*/g,'').replace(/\\([_#.()\[\]\-!])/g,'$1'));
  });
  const COLW=360,GAP=22,FS=15,ROWW=5200;let fx=0,fy=0,rowH=0,ci=0;
  groups.forEach(gr=>{
    gr.secs=gr.secs.filter(s=>s.title||s.body.join('').trim());
    const n=gr.secs.length;if(!n)return;
    const cols=Math.max(1,Math.min(3,Math.ceil(Math.sqrt(n))));
    const colsY=Array(cols).fill(76),col=COLORS[ci++%5];
    const items=gr.secs.map(s=>{
      const body=s.body.join('\n').replace(/\n{3,}/g,'\n\n').trim(),cpl=Math.floor((COLW-24)/(FS*0.62));
      const nl=body?body.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/cpl)),0):0;
      return{s,body,h:clamp(Math.round(58+nl*FS*1.55+14),90,560)};
    });
    const FW=cols*(COLW+GAP)+GAP;
    if(fx>0&&fx+FW>ROWW){fx=0;fy+=rowH+80;rowH=0}
    items.forEach(it=>{let k=0;colsY.forEach((y,i)=>{if(y<colsY[k])k=i});
      bd.boxes.push({id:uid(),t:'text',x:fx+GAP+k*(COLW+GAP),y:fy+colsY[k],w:COLW,h:it.h,title:it.s.title,body:it.body,c:col,fs:FS,z:1});colsY[k]+=it.h+GAP});
    const FH=Math.max(...colsY)+6;
    bd.boxes.unshift({id:uid(),t:'frame',x:fx,y:fy,w:FW,h:FH,title:gr.title,body:'',c:col==='#d9c18a'?'#9b8452':col,fs:24,z:0});
    fx+=FW+60;rowH=Math.max(rowH,FH);
  });
  return bd;
}

function alignSel(k){
  const bs=[...sel].map(bx).filter(Boolean);if(bs.length<2)return;snap();
  const H=b=>b.fold?36:b.h;
  if(k==='left'){const m=Math.min(...bs.map(b=>b.x));bs.forEach(b=>b.x=m)}
  else if(k==='top'){const m=Math.min(...bs.map(b=>b.y));bs.forEach(b=>b.y=m)}
  else if(k==='hdist'){const s=bs.slice().sort((a,b)=>a.x-b.x),a=s[0].x,z=s[s.length-1].x+s[s.length-1].w,tot=s.reduce((t,b)=>t+b.w,0),gap=(z-a-tot)/(s.length-1);let x=a;s.forEach(b=>{b.x=Math.round(x);x+=b.w+gap})}
  else if(k==='vdist'){const s=bs.slice().sort((a,b)=>a.y-b.y),a=s[0].y,z=s[s.length-1].y+H(s[s.length-1]),tot=s.reduce((t,b)=>t+H(b),0),gap=(z-a-tot)/(s.length-1);let y=a;s.forEach(b=>{b.y=Math.round(y);y+=H(b)+gap})}
  else if(k==='size'){const f=bs[0];bs.forEach(b=>{b.w=f.w;b.h=f.h})}
  render();
}

  if(name==null){name=prompt('템플릿 이름 (예: 전투 장면, NPC 소개)','');if(!name)return}
  const ox=Math.min(...bs.map(b=>b.x)),oy=Math.min(...bs.map(b=>b.y)),ids=bs.map(b=>b.id);
  const boxes=bs.map(b=>{const c=JSON.parse(JSON.stringify(b));delete c.jk;c.x-=ox;c.y-=oy;c.who=[];return c});

/* ---------- 검색 (보드 · 문서 · 핀 · 메모 전체) ---------- */
function toggleSearch(){const s=$('srch');const on=s.style.display!=='block';s.style.display=on?'block':'none';if(on){s.focus();if(s.value)doSearch(s.value)}else{s.value='';doSearch('')}}
function hl(t,q){t=String(t||'');const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t.slice(0,80));const a=Math.max(0,i-18);return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,i+q.length+60))}
function doSearch(q){
  hits.clear();q=q.trim().toLowerCase();const out=[];
  if(q){
    S.boards.forEach(bd=>bd.boxes.forEach(b=>{
      if(filter&&!(filter==='__text'?b.t==='text':(b.t==='memo'&&b.kind===filter)))return;if(filterC&&!(b.who||[]).includes(filterC))return;

      else if(b.t==='map')(b.pins||[]).forEach(p=>{if(((p.name||'')+(p.note||'')).toLowerCase().includes(q))out.push({k:'pin',bd,b,t:''+(p.name||'핀'),s:hl((p.name||'')+' '+(p.note||''),q)})});

/* ---------- 문서 → 박스 ---------- */
function docToBoxes(){
  const d=docs().find(x=>x.id===docCur);if(!d)return;const root=$('dbody');
  const secs=[];let cur=null;
  const push=t=>{if(!cur){cur={title:d.name||'문서',lines:[]};secs.push(cur)}cur.lines.push(t)};
  const walk=n=>{
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3){const t=c.textContent;if(t.trim())push(t.trim());return}
      if(c.nodeType!==1)return;const tg=c.tagName;
      if(tg==='H1'||tg==='H2'||tg==='H3'){cur={title:c.innerText.trim()||'제목 없음',lines:[]};secs.push(cur);return}
      if(tg==='UL'||tg==='OL'){[...c.children].forEach((li,i)=>push((tg==='OL'?(i+1)+'. ':'• ')+li.innerText.trim()));return}
      if(tg==='HR')return;
      if(tg==='DIV'||tg==='P'){const t=c.innerText.replace(/\n+$/,'');t.split('\n').forEach(l=>{const m=l.match(/^#{1,4}\s+(.*)$/);if(m){cur={title:m[1].trim(),lines:[]};secs.push(cur)}else if(l.trim())push(l.trim())});return}
      const t=c.innerText.trim();if(t)push(t);
    })};
  walk(root);
  const real=secs.filter(s=>s.lines.length||s.title);if(!real.length)return toast('박스로 나눌 내용이 없어요');
  snap();const bb=bounds(B.boxes)||{x:0,y:0,w:0,h:0},ox=bb.x,oy=bb.y+bb.h+(B.boxes.length?140:0)+70,W=340,G=20,cols=Math.min(3,Math.max(1,Math.ceil(Math.sqrt(real.length)))),ys=Array(cols).fill(0);
  let z=1+Math.max(0,...B.boxes.map(x=>x.z||1));sel.clear();const made=[];
  real.forEach(s=>{const body=s.lines.join('\n'),cpl=Math.floor((W-24)/9.3),nl=body.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/cpl)),0),hh=clamp(Math.round(58+nl*23+14),110,560);
    let k=0;ys.forEach((y,j)=>{if(y<ys[k])k=j});
    const b={id:uid(),t:'text',x:ox+20+k*(W+G),y:oy+ys[k],w:W,h:hh,title:s.title,body,c:'#d9c18a',fs:15,z:z++,who:[]};B.boxes.push(b);made.push(b);sel.add(b.id);ys[k]+=hh+G});
  B.boxes.unshift({id:uid(),t:'frame',x:ox,y:oy-70,w:cols*(W+G)+G,h:Math.max(...ys)+76,title:(d.name||'문서')+' → 박스',body:'',c:'#9b8452',fs:22,z:0});
  if(docOpen)toggleDoc();render();fitAll(made);toast(real.length+'개 박스로 나눴어요');
}

async function jrGet(url,tk,q){const r=await fetch(url+(url.includes('?')?'&':'?')+'action='+q+(tk?'&tk='+encodeURIComponent(tk):''),{redirect:'follow'});return JSON.parse(await r.text())}
async function jrLoad(url,pw){
  if(!/^https:\/\/script\.google\.com\//.test(url))throw new Error('저널 서버 주소(https://script.google.com/…/exec)를 넣어 주세요');
  const tkKey='gmj_tk:'+url;let tk=localStorage.getItem(tkKey)||'',d=await jrGet(url,tk,'load');
  if(d&&(d.status==='AUTH'||d.status==='BAD'||(!d.quests&&d.status))){
    if(!pw)throw new Error('로그인이 필요해요. 비밀번호를 넣어 주세요');
    const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({__auth:'login',pw,name:'GM 보드'})}),j=JSON.parse(await r.text());

    if(!(j.status==='OK'&&j.tk))throw new Error('로그인하지 못했어요: '+(j.message||j.status||'알 수 없음'));
    tk=j.tk;localStorage.setItem(tkKey,tk);d=await jrGet(url,tk,'load');
  }
  if(!d||!d.quests)throw new Error('저널 데이터를 받지 못했어요. 주소를 확인해 주세요');
  let m=null;try{m=await jrGet(url,tk,'loadMap')}catch(e){}

  return{quests:d.quests,globalNpcs:d.globalNpcs||[],
    pcs:(bt.pcs||[]).map(p=>({id:p.id,name:p.name||'',off:!!p.off,st:p.st||''})),
    map:m&&m.maps?{maps:m.maps||[],pins:(m.pins||[]).map(p=>({id:p.id,mapId:p.mapId,x:p.x,y:p.y,title:p.title||'',category:p.category||'',desc:p.desc||'',sessions:p.sessions||[],quests:p.quests||[]})),categories:m.categories||[]}:null,

    clueBoard:bt.clueBoard?{lanes:(bt.clueBoard.lanes||[]).map(l=>({id:l.id,label:l.label||'',session:l.session})),cards:(bt.clueBoard.cards||[]).map(k=>({id:k.id,text:k.text||'',done:!!k.done,lid:k.lid||'',qids:k.qids||[]}))}:null};
}

  sites.forEach(s=>{try{if($('ms_pw').checked&&s.p)localStorage.setItem('gmj_pw:'+s.u.trim(),s.p);else if(!$('ms_pw').checked)localStorage.removeItem('gmj_pw:'+s.u.trim())}catch(e){}});

    }catch(e){log+='✗ '+s.n+' — '+(e.message||e)+'\n'}
  }
  msg(log);if(first){useTeam(first);toast(ok+'개 사이트를 팀별로 가져왔어요')}
}

function imgSize(url){return new Promise(res=>{const im=new Image();im.onload=()=>res(im.naturalWidth/im.naturalHeight);im.onerror=()=>res(1.5);im.src=url;setTimeout(()=>res(1.5),4000)})}
function jrRun(){
  const g=k=>$('jr_'+k)&&$('jr_'+k).checked;dlgClose();toast('가져오는 중…');
  jrImport(JR,{on:{ch:g('ch'),q:g('q'),m:g('m'),i:g('i'),c:g('c')},skip:g('skip'),withDone:g('done'),img:g('img')});
}
async function jrImport(d,opts){
  const on=k=>opts.on[k],skip=opts.skip,withDone=opts.withDone;
  commit();
  const nb=newBoard('저널 가져옴');
  S.boards.push(nb);B=nb;S.cur=nb.id;
  const idByName={};CH().forEach(c=>idByName[c.name]=c.id);
  const addCh=(nm,col)=>{nm=String(nm||'').trim();if(!nm||idByName[nm])return;const c={id:uid(),name:nm,c:col};T.chars=T.chars||[];T.chars.push(c);idByName[nm]=c.id};
  if(on('ch')){(d.pcs||[]).forEach(p=>{if(skip&&(p.off||p.st==='dead'||p.st==='out'))return;addCh(p.name,'#f4b8b8')});(d.globalNpcs||[]).forEach(p=>{if(skip&&(p.st==='dead'||p.st==='out'||p.st==='missing'))return;addCh(p.name,'#a8d8ea')})}
  const npcName={};(d.globalNpcs||[]).forEach(n=>npcName[n.id]=n.name);
  const COL=['#d9c18a','#9fc7a0','#9bb8d9','#c7a6d9','#e6a58f'];let oy=0,z=1;
  const frame=(title,x,y,w,h,c)=>B.boxes.unshift({id:uid(),t:'frame',x,y,w,h,title,body:'',c,fs:24,z:0});
  const qbox={};
  if(on('q')){
    const qs=(d.quests||[]).filter(q=>withDone||!skip||q.status!=='completed'),cols=4,W=360,G=22;const ys=Array(cols).fill(76);
    const folders=[...new Set(qs.map(q=>q.folder||'기본'))];
    qs.forEach((q,i)=>{
      const body=[q.description||'',q.outcome?'\n[결과] '+q.outcome:'',(q.tags&&q.tags.length)?'\n#'+q.tags.join(' #'):''].join('').trim();
      const h=clamp(Math.round(60+(body.length/22+body.split('\n').length)*23),130,420);let k=0;ys.forEach((y,j)=>{if(y<ys[k])k=j});
      const who=(q.npcIds||[]).map(i=>idByName[npcName[i]]).filter(Boolean);
      const b={id:uid(),jk:'q:'+q.id,t:'text',x:20+k*(W+G),y:oy+ys[k],w:W,h,title:(q.sessionNum?q.sessionNum+'회차 · ':'')+(q.title||'퀘스트')+(q.status==='completed'?' ✓':''),body,c:COL[Math.max(0,folders.indexOf(q.folder||'기본'))%COL.length],fs:15,z:z++,who};
      B.boxes.push(b);qbox[q.id]=b.id;ys[k]+=h+G});
    if(qs.length){const H=Math.max(...ys)+6;frame('퀘스트',0,oy,cols*(W+G)+G,H,'#9b8452');oy+=H+80}
  }
  if(on('m')&&d.map){
    const cat=Object.fromEntries((d.map.categories||[]).map((c,i)=>[c.name,['#c0392b','#2f7d4f','#2a6fb0','#8e44ad','#d68910','#16a085'][i%6]]));
    let x=20;const top=oy+76;
    for(const m of (d.map.maps||[])){
      if(!m.url)continue;const ar=await imgSize(m.url),w=520,h=Math.round(w/ar)+54;
      const pins=(d.map.pins||[]).filter(p=>p.mapId===m.id).map(p=>({id:uid(),jk:'p:'+p.id,x:clamp((Number(p.x)||0)/100,0,1),y:clamp((Number(p.y)||0)/100,0,1),name:p.title||'',note:[(p.sessions&&p.sessions.length?p.sessions.join('·')+'회차\n':''),p.desc||''].join('').trim(),c:cat[p.category]||'#c0392b',link:(p.quests||[]).map(q=>qbox[q.id]).find(Boolean)||''}));
      B.boxes.push({id:uid(),jk:'m:'+m.id,t:'map',x,y:top,w,h,title:m.name||'지도',src:m.url,ar,c:'#f3e9d0',fs:15,z:z++,who:[],pins});x+=w+40}
    if(x>20){frame('지도',0,oy,x,Math.max(...B.boxes.filter(b=>b.t==='map').map(b=>b.h))+100,'#2a6fb0');oy+=Math.max(...B.boxes.filter(b=>b.t==='map').map(b=>b.h))+180}
  }
  if(on('i')){
    const its=d.items||[],cols=6,W=230,G=20,ys=Array(cols).fill(76);
    its.forEach(it=>{let k=0;ys.forEach((y,j)=>{if(y<ys[k])k=j});
      const has=!!it.img&&opts.img,h=has?250:150,who=it.pc&&idByName[it.pc]?[idByName[it.pc]]:[];
      const b=has?{id:uid(),jk:'i:'+it.id,t:'img',x:20+k*(W+G),y:oy+ys[k],w:W,h,title:it.label||'',body:it.detail||'',src:it.img,c:'#fffdf6',fs:15,z:z++,who,pins:[]}
        :{id:uid(),jk:'i:'+it.id,t:'memo',x:20+k*(W+G),y:oy+ys[k],w:W,h,title:it.label||'아이템',body:it.detail||'',c:kcol('아이템'),fs:15,kind:'아이템',st:0,z:z++,who};
      B.boxes.push(b);ys[k]+=h+G});
    if(its.length){const H=Math.max(...ys)+6;frame('아이템',0,oy,cols*(W+G)+G,H,'#d68910');oy+=H+80}
  }
  if(on('c')&&d.clueBoard){
    const lanes=d.clueBoard.lanes||[],cards=d.clueBoard.cards||[];let x=0;
    const byL={};cards.forEach(c=>{(byL[c.lid||'']=byL[c.lid||'']||[]).push(c)});
    const order=lanes.length?lanes:[{id:'',label:'단서'}];
    order.forEach(l=>{const cs=byL[l.id]||[];if(!cs.length)return;let y=oy+76;
      cs.forEach(c=>{const b={id:uid(),jk:'c:'+c.id,t:'memo',x:x+14,y,w:240,h:140,title:(c.text||'').slice(0,16),body:c.text||'',c:kcol('단서'),fs:15,kind:'단서',st:c.done?2:0,z:z++,who:[]};
        const q=(c.qids||[]).map(q=>qbox[q]).find(Boolean);B.boxes.push(b);if(q)B.links.push({a:b.id,b:q});y+=140+16});
      frame(l.label||'단서',x,oy,268,y-oy,'#9b8452');x+=300});
    if(x)oy+=420;
  }
  // 새 종류(아이템 등) 보이게
  if(!KN().includes('아이템')&&B.boxes.some(b=>b.kind==='아이템')){S.kinds=KS().concat([{n:'아이템',c:'#d68910'}])}
  B.boxes.forEach(b=>{if(b.kind==='아이템')b.c=kcol('아이템')});
  // 이전에 가져온 보드가 있으면 거기에 합쳐요 (같은 항목은 내용만 갱신, 새 항목만 추가, 내가 옮긴 위치·크기·색은 그대로)
  const ex=S.boards.find(b=>b!==nb&&b.boxes.some(x=>x.jk));
  let msg='저널에서 가져왔어요 ('+nb.boxes.length+'개)';
  if(ex){
    const byK={};ex.boxes.forEach(x=>{if(x.jk)byK[x.jk]=x});const map={};let upd=0;const fresh=[];
    nb.boxes.filter(x=>x.t!=='frame').forEach(x=>{
      const o=byK[x.jk];
      if(o){map[x.id]=o.id;
        if(o.t==='map'){o.title=x.title;o.src=x.src;o.ar=x.ar;const pk={};(o.pins||[]).forEach(p=>{if(p.jk)pk[p.jk]=p});
          x.pins.forEach(p=>{const q=pk[p.jk];if(q){q.name=p.name;q.note=p.note;q.c=p.c;q.x=p.x;q.y=p.y}else{o.pins.push(p)}})}
        else{const ch=o.title!==x.title||o.body!==x.body;o.title=x.title;o.body=x.body;if(x.who)o.who=x.who;if(x.t==='memo'&&x.kind==='단서'&&o.st<x.st)o.st=x.st;if(ch)upd++}
      }else fresh.push(x)});
    let added=0;
    if(fresh.length){
      const bb=bounds(ex.boxes)||{x:0,y:0,w:0,h:0},fb=bounds(fresh),dx=bb.x-fb.x,dy=bb.y+bb.h+140-fb.y;
      fresh.forEach(x=>{x.x+=dx;x.y+=dy;map[x.id]=x.id;ex.boxes.push(x);added++});
      ex.boxes.unshift({id:uid(),t:'frame',x:fb.x+dx-20,y:fb.y+dy-70,w:fb.w+40,h:fb.h+90,title:'새로 추가 · '+new Date().toISOString().slice(0,10),body:'',c:'#2f7d4f',fs:24,z:0});
    }
    // 핀 → 퀘스트 연결, 단서 → 퀘스트 선 (새 id로 바꿔서)
    ex.boxes.filter(x=>x.t==='map').forEach(m=>(m.pins||[]).forEach(p=>{if(p.link&&map[p.link])p.link=map[p.link]}));
    nb.links.forEach(l=>{const a=map[l.a],b2=map[l.b];if(a&&b2&&!ex.links.some(k=>k.a===a&&k.b===b2))ex.links.push({a,b:b2})});
    S.boards=S.boards.filter(b=>b!==nb);B=ex;S.cur=ex.id;
    msg='이전에 가져온 보드에 합쳤어요 — 새로 '+added+'개 추가, '+upd+'개 내용 갱신';
  }
  hist=[];fut=[];sel.clear();drawTabs();render();fitAll();save();toast(msg);
  return msg;
}

/* ---------- 서버 동기화 (Apps Script) ---------- */
const DEFAULT_URL='';   // 배포한 Apps Script 웹앱 주소를 여기에 넣어도 돼요
let SY={url:'',key:'',rev:'',dirty:false,busy:false,off:false};
try{SY.url=localStorage.getItem('gmb_url')||DEFAULT_URL;SY.key=localStorage.getItem('gmb_key')||'';SY.rev=localStorage.getItem('gmb_rev')||''}catch(e){SY.url=DEFAULT_URL}
function syLabel(t,cls){const b=$('syncbtn');b.textContent=t;b.classList.toggle('on',cls==='ok')}
function syPayload(){commit();return JSON.stringify({teams:S.teams.map(t=>({id:t.id,name:t.name,cur:t.cur,docs:t.docs,chars:t.chars,boards:t.boards.map(b=>({id:b.id,name:b.name,boxes:b.boxes,links:b.links}))})),team:S.team,kinds:S.kinds,sites:S.sites||null,tpls:S.tpls||[]})}
function viewsGet(){try{return JSON.parse(localStorage.getItem('gmb_views')||'{}')}catch(e){return{}}}
function viewsSave(){try{const v=viewsGet();S.teams.forEach(t=>(t===T?S.boards:t.boards).forEach(b=>v[b.id]=b.view));localStorage.setItem('gmb_views',JSON.stringify(v))}catch(e){}}
function syApply(d){ // 서버 내용으로 바꾸기 (화면 위치·보고 있던 팀은 이 기기 것을 유지)
  const myTeam=S.team,myBoard=S.cur;d=JSON.parse(JSON.stringify(d));if(d.boards&&!d.teams)d=JSON.parse(JSON.stringify({boards:d.boards,cur:d.cur,docs:d.docs}));
  d.team=(d.teams||[]).some(t=>t.id===myTeam)?myTeam:d.team;adopt(d);
  const bb=S.boards.find(b=>b.id===myBoard);if(bb){B=bb;S.cur=bb.id}
  sel.clear();selLine=null;hist=[];fut=[];if(docOpen)docRender();drawTeams();drawTabs();render();
  try{localStorage.setItem(KEY,ser())}catch(e){}
}
async function syCall(method,body){
  const u=SY.url+(method==='GET'?(SY.url.includes('?')?'&':'?')+'key='+encodeURIComponent(SY.key)+'&action='+body:'');
  const r=method==='GET'?await fetch(u):await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:SY.key},body))});
  return r.json();
}
function syncDirty(){if(!SY.url)return;SY.dirty=true;viewsSave();syLabel('저장 대기…');clearTimeout(syncDirty.t);syncDirty.t=setTimeout(syPush,1500)}
async function syPush(){
  if(!SY.url||SY.busy)return;if(!SY.dirty)return;SY.busy=true;
  try{
    const r=await syCall('POST',{rev:SY.rev,data:syPayload()});
    if(r.ok){SY.rev=r.rev;SY.dirty=false;localStorage.setItem('gmb_rev',SY.rev);syLabel('동기화됨','ok')}
    else if(r.conflict){
      SY.busy=false;
      if(confirm('다른 기기에서 먼저 수정했어요.\n\n확인 = 그 기기의 내용을 불러와요 (이 기기에서 방금 한 변경은 사라져요)\n취소 = 이 기기의 내용으로 덮어써요')){SY.dirty=false;await syPull(true)}
      else{SY.rev=r.rev;localStorage.setItem('gmb_rev',SY.rev);SY.busy=false;return syPush()}
    }else{syLabel(''+(r.error==='auth'?'비밀번호가 달라요':'저장 실패'));}
  }catch(e){syLabel('오프라인 (나중에 다시 시도)');setTimeout(syPush,15000)}
  SY.busy=false;
}
async function syPull(force){
  if(!SY.url)return;
  try{
    const r=await syCall('GET','get');
    if(!r.ok){syLabel(''+(r.error==='auth'?'비밀번호가 달라요':'연결 실패'));return}
    if(!r.rev||!r.data){ // 서버가 비어 있으면 이 기기 내용을 올려요
      SY.dirty=true;SY.rev='';await syPush();syMigrate();return}
    if(r.rev!==SY.rev||force){
      if(SY.dirty&&!force)return; // 내 변경이 먼저
      const a=document.activeElement;if(!force&&a&&(/INPUT|TEXTAREA/.test(a.tagName)||a.isContentEditable))return;
      syApply(JSON.parse(r.data));SY.rev=r.rev;localStorage.setItem('gmb_rev',SY.rev);
    }
    syLabel('동기화됨','ok');syMigrate();
  }catch(e){syLabel('오프라인')}
}
async function syncSetup(){
  const u=prompt('Apps Script 웹앱 주소 (비우면 서버 연결을 끊어요)',SY.url);if(u===null)return;
  if(!u.trim()){SY.url='';localStorage.removeItem('gmb_url');syLabel('서버 연결 안 됨');return}
  const k=prompt('보드 비밀번호 (서버 스크립트에 적어 둔 것)',SY.key);if(k===null)return;
  SY.url=u.trim();SY.key=k;SY.rev='';localStorage.setItem('gmb_url',SY.url);localStorage.setItem('gmb_key',SY.key);localStorage.removeItem('gmb_rev');
  syLabel('연결 중…');await syPull();toast('서버와 연결했어요');
}
if(SY.url){syLabel('연결 중…');syPull();setInterval(()=>{if(!document.hidden)syPull()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syPull()})}

/* ---------- 시작 ---------- */
load();drawTeams();drawTabs();render();themeApply();snapLabel();
if(B.boxes.length)fitAll();
else{ // 처음이면 안내 박스 몇 개
  const mk=(t,x,y,w,h,title,body,c,extra)=>B.boxes.push(Object.assign({id:uid(),t,x,y,w,h,title,body,c,fs:15,z:1,kind:'단서',st:0},extra||{}));
  mk('frame',0,0,860,520,'예시 · 이 틀 안의 박스를 지우고 시작해요','', '#9b8452',{fs:16});
  mk('text',30,60,360,250,'사용법','• 빈 곳을 끌면 화면 이동, 휠로 확대·축소\n• 박스 머리를 끌면 이동, 오른쪽 아래 모서리로 크기 조절\n• [한눈에]를 누르면 전체가 보여요. 멀리서 보면 제목만 크게 보여요\n• 선택하면 위에 색·글자 크기·복제·삭제 바가 나와요','#d9c18a');
  mk('memo',420,70,240,160,'','수로 지하의 낡은 열쇠 — 누가 갖고 있을까?','#f1d34e',{kind:'단서',title:'낡은 열쇠'});
  mk('memo',690,90,240,150,'','회색 망토 사내의 정체는 마지막 회차에 공개','#e6a58f',{kind:'떡밥',title:'회색 망토',st:1});
  mk('text',420,270,360,200,'연결','연결 버튼(또는 L)을 켜고 박스 두 개를 차례로 누르면 선으로 이어요.\n선을 누르면 방향 바꾸기·삭제가 나와요.','#9bb8d9');
  B.links.push({a:B.boxes[3].id,b:B.boxes[4].id});
  render();fitAll();
}
